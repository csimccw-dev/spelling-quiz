<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聽音拼單字</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root { --primary: #3498db; --success: #2ecc71; --accent: #f1c40f; --text: #2c3e50; --danger: #e74c3c; }
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f0f7fa; display: flex; flex-direction: column; align-items: center; padding: 15px; margin: 0; }
        .card { background: white; padding: 1.5rem; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; box-sizing: border-box; }
        
        /* 圖片預覽與旋轉 */
        #preview-container { display: none; margin-top: 15px; text-align: center; }
        .preview-wrapper { width: 100%; height: 250px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 15px; background: #fafafa; border-radius: 8px; border: 1px dashed #ccc; }
        #image-preview { max-width: 100%; max-height: 100%; transition: transform 0.3s ease; }
        .btn-action { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; color: white; font-size: 1rem; font-weight: bold; }
        .bg-primary { background: var(--primary); }
        .bg-success { background: var(--success); }

        /* 校正頁面 */
        #edit-section { display: none; }
        .word-item { display: flex; align-items: center; margin-bottom: 8px; gap: 8px; }
        .word-item input { flex-grow: 1; padding: 10px; font-size: 1.1rem; border: 1px solid #ddd; border-radius: 8px; }
        .btn-edit { padding: 8px 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; }
        .btn-delete { padding: 8px 12px; background: var(--danger); color: white; border: none; border-radius: 8px; cursor: pointer; }

        /* 測驗頁面顯示區 */
        #quiz-section { display: none; }
        #display-container { width: 100%; margin: 2rem 0; min-height: 5rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        
        /* 每個字母的獨立方塊樣式 */
        .char-box { border-bottom: 4px solid var(--text); width: 25px; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-family: 'Arial', sans-serif; font-weight: bold; }
        
        /* 大按鈕與語速控制樣式 */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .speed-control { grid-column: span 2; display: flex; align-items: center; justify-content: center; gap: 10px; background: #f8f9fa; padding: 10px 15px; border-radius: 15px; border: 1px solid #eee; }
        .speed-control input[type=range] { flex-grow: 1; cursor: pointer; }
        .btn-main { border: none; border-radius: 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
        .btn-audio { grid-column: span 2; background: var(--accent); color: #444; }
        .btn-audio .icon { font-size: 4rem; } 
        .btn-nav { background: var(--primary); color: white; }
        .btn-toggle { grid-column: span 2; background: var(--success); color: white; }
        .icon { font-size: 2.5rem; margin-bottom: 5px; }
        .label { font-size: 1rem; font-weight: bold; }

        .btn-add { width: 100%; margin: 10px 0; padding: 12px; background: white; color: var(--primary); border: 2px dashed var(--primary); border-radius: 10px; cursor: pointer; }
        .btn-confirm { width: 100%; margin-top: 15px; padding: 18px; background: var(--success); color: white; font-size: 1.3rem; border: none; border-radius: 15px; box-shadow: 0 4px 0 #27ae60; cursor: pointer; }
    </style>
</head>
<body>

<div class="card" id="upload-section">
    <h2>📷 第一步：上傳照片 <span style="font-size: 0.8rem; color: #aaa;">v0.6</span></h2>
    <input type="file" id="image-input" accept="image/*">
    
    <div id="preview-container">
        <div class="preview-wrapper">
            <img id="image-preview" src="" alt="預覽圖片">
        </div>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="btn-action bg-primary" onclick="rotateImage()">🔄 旋轉圖片</button>
            <button class="btn-action bg-success" onclick="processImage()">✅ 確認並辨識</button>
        </div>
    </div>

    <div id="status" style="margin-top:20px; color:#666;">請選取單字圖片</div>
</div>

<div class="card" id="edit-section">
    <h2>✏️ 第二步：確認單字</h2>
    <div id="word-list" style="max-height: 300px; overflow-y: auto;"></div>
    <button class="btn-add" onclick="addNewWord()">➕ 手動增加</button>
    <button class="btn-confirm" onclick="startQuiz()">確認無誤，開始測驗</button>
</div>

<div class="card" id="quiz-section">
    <div id="quiz-counter" style="text-align: right; color: #999; font-weight: bold;">1 / 1</div>
    <div id="display-container"></div>
    <div class="controls">
        <div class="speed-control">
            <span class="label">語速</span>
            <input type="range" id="speed-slider" min="0.3" max="1.5" step="0.1" value="0.7" oninput="document.getElementById('speed-label').innerText = parseFloat(this.value).toFixed(1)">
            <span class="label"><span id="speed-label">0.7</span>x</span>
        </div>
        <button class="btn-main btn-audio" onclick="playCurrentWord()">
            <span class="icon">📢</span><span class="label">發音</span>
        </button>
        <button class="btn-main btn-nav" onclick="prevWord()">
            <span class="icon">⬅️</span><span class="label">上一題</span>
        </button>
        <button class="btn-main btn-nav" onclick="nextWord()">
            <span class="icon">➡️</span><span class="label">下一題</span>
        </button>
        <button class="btn-main btn-toggle" id="btn-toggle" onclick="toggleAnswer()">
            <span class="icon" id="eye-icon">👁️</span><span class="label" id="toggle-label">顯示</span>
        </button>
    </div>
    <button style="margin-top:25px; background:none; border:none; color:#aaa; text-decoration:underline; cursor: pointer;" onclick="location.reload()">重新上傳</button>
</div>

<script>
    let words = [];
    let currentIndex = 0;
    let isShowing = false;
    let rotationAngle = 0;

    document.getElementById('image-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        rotationAngle = 0;
        const imgPreview = document.getElementById('image-preview');
        imgPreview.src = URL.createObjectURL(file);
        imgPreview.style.transform = `rotate(${rotationAngle}deg)`;
        
        document.getElementById('preview-container').style.display = 'block';
        document.getElementById('status').innerText = "請點擊「旋轉圖片」直到文字為水平正向，再按確認";
    });

    function rotateImage() {
        rotationAngle = (rotationAngle + 90) % 360;
        document.getElementById('image-preview').style.transform = `rotate(${rotationAngle}deg)`;
    }

    async function processImage() {
        document.getElementById('status').innerText = "影像溫和對比增強處理中...";
        const imgPreview = document.getElementById('image-preview');
        
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.src = imgPreview.src;
        await new Promise(r => img.onload = r);

        const MAX_SIZE = 2000;
        let scale = 1;
        if (img.width > MAX_SIZE || img.height > MAX_SIZE) {
            scale = Math.min(MAX_SIZE / img.width, MAX_SIZE / img.height);
        }
        const scaledWidth = img.width * scale;
        const scaledHeight = img.height * scale;

        if (rotationAngle === 90 || rotationAngle === 270) {
            canvas.width = scaledHeight;
            canvas.height = scaledWidth;
        } else {
            canvas.width = scaledWidth;
            canvas.height = scaledHeight;
        }

        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((rotationAngle * Math.PI) / 180);
        ctx.drawImage(img, -scaledWidth / 2, -scaledHeight / 2, scaledWidth, scaledHeight);

        // ==========================================
        // 核心進化 (v0.6)：灰階對比度增強 (Contrast Stretch)
        // 放棄強制洗成純白，改為加深黑色字體並適度提亮背景
        // 這樣能保留邊緣平滑度，避免右側較淡的字被消滅
        // ==========================================
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];
            // 轉換為灰階亮度
            let gray = 0.299 * r + 0.587 * g + 0.114 * b;
            
            // 提升對比度公式：(亮度 - 128) * 增強係數 + 128
            let contrast = (gray - 128) * 1.8 + 128; 
            let finalGray = Math.min(255, Math.max(0, contrast));
            
            data[i] = finalGray;       // R
            data[i + 1] = finalGray;   // G
            data[i + 2] = finalGray;   // B
        }
        ctx.putImageData(imageData, 0, 0);

        try {
            document.getElementById('status').innerText = "OCR 文字解析中...";
            const worker = await Tesseract.createWorker('eng');
            
            await worker.setParameters({
                tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT,
            });
            
            const { data: { text } } = await worker.recognize(canvas);
            await worker.terminate();

            // 精確後處理與碎字過濾
            let rawWords = text.split(/[\s\n\r]+/)
                               .map(w => w.replace(/[^a-zA-Z]/g, ''))
                               // 注意：這裡將最短長度提高到 3，可瞬間秒殺 ar, et, ja 等雜點碎字
                               // 若未來測驗包含 do, is, to 等 2 字元單字，可改回 >= 2
                               .filter(w => w.length >= 3); 
                               
            // 過濾孤立的全大寫雜訊 (如 ERE)
            rawWords = rawWords.filter(w => !(w === w.toUpperCase() && w.length < 4));
            
            // 移除重複出現的單字
            words = [...new Set(rawWords)];
            
            if (words.length === 0) {
                throw new Error("未能提取出任何有效單字，請確保圖片文字清晰。");
            }

            renderWordList();
            document.getElementById('upload-section').style.display = 'none';
            document.getElementById('edit-section').style.display = 'block';
        } catch (err) { 
            alert("辨識失敗：" + err.message); 
            document.getElementById('status').innerText = "辨識失敗，請重試";
        }
    }

    function renderWordList() {
        const list = document.getElementById('word-list');
        list.innerHTML = '';
        words.forEach((word, index) => {
            const div = document.createElement('div');
            div.className = 'word-item';
            div.innerHTML = `
                <input type="text" value="${word}" id="input-${index}" disabled>
                <button class="btn-edit" id="btn-edit-${index}" onclick="toggleEdit(${index})">修正</button>
                <button class="btn-delete" onclick="deleteWord(${index})">刪除</button>
            `;
            list.appendChild(div);
        });
    }

    function toggleEdit(index) {
        const input = document.getElementById(`input-${index}`);
        const btn = document.getElementById(`btn-edit-${index}`);
        if (input.disabled) {
            input.disabled = false; input.focus();
            btn.innerText = "完成"; btn.style.backgroundColor = "var(--success)";
        } else {
            input.disabled = true; words[index] = input.value.trim();
            btn.innerText = "修正"; btn.style.backgroundColor = "var(--primary)";
        }
    }

    function addNewWord() {
        const newWord = prompt("請輸入單字：");
        if (newWord?.trim()) {
            words.push(newWord.trim());
            renderWordList();
        }
    }

    function deleteWord(index) {
        if (confirm("確定要刪除這個單字嗎？")) {
            words.splice(index, 1);
            renderWordList();
        }
    }

    function startQuiz() {
        const allInputs = document.querySelectorAll('.word-item input');
        words = Array.from(allInputs).map(i => i.value.trim()).filter(w => w !== "");
        if (words.length === 0) return;
        document.getElementById('edit-section').style.display = 'none';
        document.getElementById('quiz-section').style.display = 'block';
        currentIndex = 0;
        initQuizWord();
    }

    function initQuizWord() {
        isShowing = false;
        updateToggleUI();
        document.getElementById('quiz-counter').innerText = `${currentIndex + 1} / ${words.length}`;
        updateDisplay();
    }

    function updateDisplay() {
        const container = document.getElementById('display-container');
        container.innerHTML = '';
        const targetWord = words[currentIndex];
        const boxWidth = targetWord.length > 10 ? 20 : 30;

        for (let i = 0; i < targetWord.length; i++) {
            const box = document.createElement('div');
            box.className = 'char-box';
            box.style.width = boxWidth + 'px';
            
            if (isShowing) {
                box.innerText = targetWord[i];
                box.style.borderBottomColor = "transparent";
                box.style.color = "var(--success)";
            } else {
                box.innerText = "";
                box.style.borderBottomColor = "var(--text)";
            }
            container.appendChild(box);
        }
    }

    function toggleAnswer() {
        isShowing = !isShowing;
        updateToggleUI();
        updateDisplay();
    }

    function updateToggleUI() {
        document.getElementById('eye-icon').innerText = isShowing ? "🙈" : "👁️"; 
        document.getElementById('toggle-label').innerText = isShowing ? "隱藏" : "顯示";
    }

    function playCurrentWord() {
        const utterance = new SpeechSynthesisUtterance(words[currentIndex]);
        utterance.lang = 'en-US';
        utterance.rate = parseFloat(document.getElementById('speed-slider').value);
        window.speechSynthesis.speak(utterance);
    }

    function nextWord() { if (currentIndex < words.length - 1) { currentIndex++; initQuizWord(); } }
    function prevWord() { if (currentIndex > 0) { currentIndex--; initQuizWord(); } }
</script>
</body>
</html>
